name: Check, package and release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/set-version.py "$RELEASE_TAG"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: python3 -m unittest discover -s tests -p 'test_*.py'

  package:
    needs: check
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            builder: --docker
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            builder: --docker
          - runner: macos-15
            target: aarch64-apple-darwin
            builder: native
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set package version from tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/set-version.py "$RELEASE_TAG"
      - name: Install pinned Rust
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Test, build and package
        run: bash scripts/package.sh '${{ matrix.target }}' '${{ matrix.builder }}'
      - uses: actions/upload-artifact@v4
        with:
          name: cps-block-ua-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    needs: [check, package]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cps-block-ua-*
          path: dist
          merge-multiple: true
      - name: Verify complete package set
        working-directory: dist
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            sha256sum -c "hewenyu.cps-block-ua-${RELEASE_TAG#v}-$target.tar.gz.sha256"
          done
      - name: Publish tag release with installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" dist/*.tar.gz dist/*.sha256
