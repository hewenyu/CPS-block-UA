[package]
name = "cps-block-ua"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false
description = "Incoming User-Agent policy middleware for Codex Proxy RS"
repository = "https://github.com/hewenyu/CPS-block-UA"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "21c0711a6693372869475d1bec3037ef4b08525f", features = ["io"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-std", "macros", "rt-multi-thread", "time"] }

[dev-dependencies]
tokio = { version = "1.48", features = ["process"] }

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "forbid"
